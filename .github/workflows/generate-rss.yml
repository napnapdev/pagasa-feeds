name: Generate RSS Feed

on:
  schedule:
    # Every 15 min (off-peak minutes for reliability; GitHub cron is best-effort).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        slug:
          - nlprsd    # Northern Luzon
          - ncrprsd   # National Capital Region
          - slprsd    # Southern Luzon
          - visprsd   # Visayas
          - minprsd   # Mindanao
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        run: python generate_rss.py ${{ matrix.slug }}

      - name: Upload feed artifact
        uses: actions/upload-artifact@v6
        with:
          name: rss-${{ matrix.slug }}
          path: ${{ matrix.slug }}.rss
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Scripts (generate/merge) live on the default branch.
      - name: Checkout scripts (main)
        uses: actions/checkout@v5
        with:
          path: main

      # Previously-published feeds live on the rss-feed branch.
      - name: Checkout published feeds (rss-feed)
        uses: actions/checkout@v5
        with:
          ref: rss-feed
          path: feed
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lxml (for merge)
        run: pip install "lxml>=5.0"

      - name: Download freshly-scraped feeds
        uses: actions/download-artifact@v7
        with:
          path: _artifacts

      - name: Merge (retain superseded advisories for 24h)
        run: |
          shopt -s nullglob
          for f in _artifacts/*/*.rss; do
            slug="$(basename "$f" .rss)"
            old="feed/${slug}.rss"
            # If no prior feed exists yet, treat empty as first run.
            if [ ! -f "$old" ]; then old="/dev/null"; fi
            python main/merge_feeds.py "$old" "$f" "feed/${slug}.rss" --hours 24
          done
          rm -rf _artifacts

      - name: Commit and push
        working-directory: feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- *.rss
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "chore: update RSS feeds (24h retain) [skip ci]"
            git push
          fi
